name: "CI"

"on": 
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: "read"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        
        include:
         
          - check: "Lint"
            command: "uv run ruff check ."
          - check: "format"
            command: "uv run ruff format --check ."
          - check: "Tests unitaires"
            command: "uv run pytest tests/unit --cov=supermarket_receipt_api.checkout --cov-report=term-missing"
          - check: "Tests d'intégration"
            command: "uv run pytest tests/integration --cov=supermarket_receipt_api.checkout --cov-report=term-missing"

    name: "${{ matrix.check }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Configurer l'environnement Python"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false

      - name: "Installer les dépendances"
        run: "uv sync --locked"

      - name: "Exécuter la commande"
        run: "${{ matrix.command }}"