name: "CI"

"on": ["push"]

permissions:
  contents: "read"

jobs:
  ci:
    name: "Contrôles qualité et tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Configurer l'environnement Python"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false

      - name: "Installer les dépendances"
        run: "uv sync --locked"

      - name: "Lint"
        run: "uv run ruff check ."

      - name: "verifier le formatage"
        run: "uv run ruff format --check ."

      - name: "Tests unitaires"
        run: "uv run pytest tests/unit --cov=supermarket_receipt_api.checkout --cov-report=term-missing"

      - name: "Tests d'intégration"
        run: "uv run pytest tests/integration --cov=supermarket_receipt_api.checkout --cov-report=term-missing"